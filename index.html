<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Mobile Adda V4</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.brand{
  font-size:24px;
  font-weight:800;
}
.sub{
  color:#cbd5e1;
  margin-top:5px;
}
.backup{
  background:white;
  color:#2563eb;
  border:0;
  padding:14px 20px;
  border-radius:12px;
  font-weight:bold;
}
nav{
  display:flex;
  gap:8px;
  padding:12px;
  background:white;
  overflow-x:auto;
  border-bottom:1px solid #ddd;
}
nav button{
  border:1px solid #d1d5db;
  background:white;
  padding:14px 20px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  white-space:nowrap;
}
nav button.active{
  background:#111827;
  color:white;
}
main{
  max-width:1100px;
  margin:auto;
  padding:25px 18px 60px;
}
h1{font-size:36px}
.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}
.card{
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 5px 18px #00000012;
}
.label{
  color:#6b7280;
  font-size:18px;
}
.number{
  font-size:40px;
  font-weight:800;
  margin-top:15px;
}
.section{
  display:none;
}
.section.active{
  display:block;
}
form{
  background:white;
  padding:22px;
  border-radius:18px;
  margin-bottom:25px;
}
input,select{
  width:100%;
  padding:14px;
  margin:7px 0 14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
}
.primary{
  width:100%;
  background:#111827;
  color:white;
  border:0;
  padding:15px;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
}
table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:15px;
  overflow:hidden;
}
th,td{
  padding:13px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
}
th{background:#111827;color:white}
.delete{
  background:#dc2626;
  color:white;
  border:0;
  padding:8px 12px;
  border-radius:8px;
}
.search{
  background:white;
  padding:15px;
  border-radius:15px;
  margin-bottom:20px;
}
.empty{
  background:white;
  padding:30px;
  border-radius:15px;
  text-align:center;
  color:#6b7280;
}
@media(max-width:650px){
  .cards{grid-template-columns:1fr}
  header{align-items:flex-start}
  .brand{font-size:21px}
  .backup{padding:10px 14px}
  h1{font-size:30px}
  table{font-size:13px}
  th,td{padding:9px}
}
</style>
</head>

<body>

<header>
  <div>
    <div class="brand">📱 मोबाइल अड्डा</div>
    <div class="sub">MOBILE ADDA • V4</div>
  </div>
  <button class="backup" onclick="backupData()">Backup</button>
</header>

<nav>
  <button class="active" onclick="showPage('dashboard',this)">📊 Dashboard</button>
  <button onclick="showPage('stock',this)">📱 Stock</button>
  <button onclick="showPage('sales',this)">💰 Sales</button>
  <button onclick="showPage('purchase',this)">🛒 Purchase</button>
</nav>

<main>

<!-- DASHBOARD -->
<section id="dashboard" class="section active">
<h1>Dashboard</h1>

<div class="cards">

<div class="card">
<div class="label">Total Stock</div>
<div class="number" id="totalStock">0</div>
</div>

<div class="card">
<div class="label">Stock Value</div>
<div class="number">₹<span id="stockValue">0</span></div>
</div>

<div class="card">
<div class="label">Sold Phones</div>
<div class="number" id="soldPhones">0</div>
</div>

<div class="card">
<div class="label">Sales Value</div>
<div class="number">₹<span id="salesValue">0</span></div>
</div>

</div>
</section>


<!-- STOCK -->
<section id="stock" class="section">
<h1>📱 Stock</h1>

<form onsubmit="addStock(event)">
<input id="phone" placeholder="Phone name e.g. iPhone 13" required>
<input id="imei" placeholder="IMEI number">
<input id="cost" type="number" placeholder="Purchase price ₹" required>
<input id="price" type="number" placeholder="Selling price ₹" required>
<select id="condition">
<option>New</option>
<option>Used</option>
<option>Refurbished</option>
</select>
<button class="primary">Add Phone to Stock</button>
</form>

<div class="search">
<input id="stockSearch" oninput="displayStock()" placeholder="🔎 Search phone or IMEI">
</div>

<div id="stockTable"></div>
</section>


<!-- SALES -->
<section id="sales" class="section">
<h1>💰 Sales</h1>

<form onsubmit="addSale(event)">
<input id="salePhone" placeholder="Phone name" required>
<input id="customer" placeholder="Customer name">
<input id="salePrice" type="number" placeholder="Sale price ₹" required>
<input id="saleDate" type="date">
<button class="primary">Record Sale</button>
</form>

<div id="salesTable"></div>
</section>


<!-- PURCHASE -->
<section id="purchase" class="section">
<h1>🛒 Purchase</h1>

<form onsubmit="addPurchase(event)">
<input id="purchasePhone" placeholder="Phone name" required>
<input id="supplier" placeholder="Supplier name">
<input id="purchasePrice" type="number" placeholder="Purchase price ₹" required>
<input id="purchaseDate" type="date">
<button class="primary">Record Purchase</button>
</form>

<div id="purchaseTable"></div>
</section>

</main>


<script>

let stock = JSON.parse(localStorage.getItem("mobileStock") || "[]");
let sales = JSON.parse(localStorage.getItem("mobileSales") || "[]");
let purchases = JSON.parse(localStorage.getItem("mobilePurchases") || "[]");


function save(){
 localStorage.setItem("mobileStock",JSON.stringify(stock));
 localStorage.setItem("mobileSales",JSON.stringify(sales));
 localStorage.setItem("mobilePurchases",JSON.stringify(purchases));
 updateDashboard();
 displayStock();
 displaySales();
 displayPurchases();
}


function showPage(page,btn){

 document.querySelectorAll(".section").forEach(x=>{
   x.classList.remove("active");
 });

 document.getElementById(page).classList.add("active");

 document.querySelectorAll("nav button").forEach(x=>{
   x.classList.remove("active");
 });

 btn.classList.add("active");
}


function addStock(e){
 e.preventDefault();

 stock.push({
   id:Date.now(),
   phone:document.getElementById("phone").value,
   imei:document.getElementById("imei").value,
   cost:Number(document.getElementById("cost").value),
   price:Number(document.getElementById("price").value),
   condition:document.getElementById("condition").value
 });

 e.target.reset();
 save();
 alert("Phone added to stock ✅");
}


function displayStock(){

 let search=(document.getElementById("stockSearch")?.value || "").toLowerCase();

 let list=stock.filter(x=>
   x.phone.toLowerCase().includes(search) ||
   x.imei.toLowerCase().includes(search)
 );

 if(list.length===0){
   document.getElementById("stockTable").innerHTML=
   '<div class="empty">No phones in stock</div>';
   return;
 }

 let html=`
 <table>
 <tr>
 <th>Phone</th>
 <th>IMEI</th>
 <th>Condition</th>
 <th>Cost</th>
 <th>Sell</th>
 <th></th>
 </tr>`;

 list.forEach(x=>{
 html+=`
 <tr>
 <td>${x.phone}</td>
 <td>${x.imei || "-"}</td>
 <td>${x.condition}</td>
 <td>₹${x.cost}</td>
 <td>₹${x.price}</td>
 <td>
 <button class="delete" onclick="deleteStock(${x.id})">Delete</button>
 </td>
 </tr>`;
 });

 html+="</table>";

 document.getElementById("stockTable").innerHTML=html;
}


function deleteStock(id){

 if(confirm("Delete this phone from stock?")){
   stock=stock.filter(x=>x.id!==id);
   save();
 }
}


function addSale(e){
 e.preventDefault();

 sales.push({
   id:Date.now(),
   phone:document.getElementById("salePhone").value,
   customer:document.getElementById("customer").value,
   price:Number(document.getElementById("salePrice").value),
   date:document.getElementById("saleDate").value ||
        new Date().toISOString().slice(0,10)
 });

 e.target.reset();
 save();

 alert("Sale recorded ✅");
}


function displaySales(){

 if(sales.length===0){
   document.getElementById("salesTable").innerHTML=
   '<div class="empty">No sales recorded</div>';
   return;
 }

 let html=`
 <table>
 <tr>
 <th>Phone</th>
 <th>Customer</th>
 <th>Price</th>
 <th>Date</th>
 </tr>`;

 sales.forEach(x=>{
 html+=`
 <tr>
 <td>${x.phone}</td>
 <td>${x.customer || "-"}</td>
 <td>₹${x.price}</td>
 <td>${x.date}</td>
 </tr>`;
 });

 html+="</table>";

 document.getElementById("salesTable").innerHTML=html;
}


function addPurchase(e){
 e.preventDefault();

 purchases.push({
   id:Date.now(),
   phone:document.getElementById("purchasePhone").value,
   supplier:document.getElementById("supplier").value,
   price:Number(document.getElementById("purchasePrice").value),
   date:document.getElementById("purchaseDate").value ||
        new Date().toISOString().slice(0,10)
 });

 e.target.reset();
 save();

 alert("Purchase recorded ✅");
}


function displayPurchases(){

 if(purchases.length===0){
   document.getElementById("purchaseTable").innerHTML=
   '<div class="empty">No purchases recorded</div>';
   return;
 }

 let html=`
 <table>
 <tr>
 <th>Phone</th>
 <th>Supplier</th>
 <th>Price</th>
 <th>Date</th>
 </tr>`;

 purchases.forEach(x=>{
 html+=`
 <tr>
 <td>${x.phone}</td>
 <td>${x.supplier || "-"}</td>
 <td>₹${x.price}</td>
 <td>${x.date}</td>
 </tr>`;
 });

 html+="</table>";

 document.getElementById("purchaseTable").innerHTML=html;
}


function updateDashboard(){

 document.getElementById("totalStock").textContent=stock.length;

 document.getElementById("stockValue").textContent=
 stock.reduce((a,x)=>a+x.cost,0).toLocaleString("en-IN");

 document.getElementById("soldPhones").textContent=sales.length;

 document.getElementById("salesValue").textContent=
 sales.reduce((a,x)=>a+x.price,0).toLocaleString("en-IN");
}


function backupData(){

 let data={
   stock:stock,
   sales:sales,
   purchases:purchases
 };

 let blob=new Blob(
   [JSON.stringify(data,null,2)],
   {type:"application/json"}
 );

 let url=URL.createObjectURL(blob);

 let a=document.createElement("a");
 a.href=url;
 a.download="mobile-adda-backup.json";
 a.click();

 URL.revokeObjectURL(url);
}


updateDashboard();
displayStock();
displaySales();
displayPurchases();

</script>

</body>
</html>
